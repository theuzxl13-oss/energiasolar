# Publica a versão de APRESENTAÇÃO (estática) no GitHub Pages a cada push na main.
# Nesta versão não há servidor: formulários, chat e admin funcionam no navegador
# (modo demonstração). Para o site completo com APIs, use a Vercel (ver README).
#
# Pré-requisito (uma única vez): Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: "true"
      NEXT_PUBLIC_STATIC_DEMO: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rotas de servidor (API e proxy) não existem em hospedagem estática.
      - name: Remover rotas de servidor do build estático
        run: rm -rf src/app/api src/proxy.ts

      - run: npx next build

      - name: Desativar Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
